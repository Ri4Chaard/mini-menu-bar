appId: cc.qubiq.minimenubar
productName: Mini Menu Bar
copyright: Copyright © 2026 Yaroslav

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources
    to: resources

mac:
  category: public.app-category.utilities
  # Generated by scripts/make-icons.mjs and committed. Regenerate only when the
  # mark changes; a contributor who never runs the script can still build.
  icon: build/icon.icns
  target:
    - dmg
    - zip
  # A menu bar utility has no Dock presence and no main window.
  extendInfo:
    LSUIElement: true
    # NSAppleEventsUsageDescription was removed with Spotify (feature 003): the
    # app no longer sends Apple Events, so macOS never prompts for automation
    # access (research.md R-211).
    NSDesktopFolderUsageDescription: >-
      Mini Menu Bar reads your Desktop to show recent screenshots. It never
      modifies, moves, or deletes any file.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: ${productName}-${version}.${ext}
