appId: com.ri4chard.minimenubar
productName: Mini Menu Bar
copyright: Copyright © 2026 Yaroslav

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources
    to: resources

mac:
  category: public.app-category.utilities
  # Applies to the zip target; dmg overrides it below with the same shape.
  artifactName: ${productName}-${version}-${arch}.${ext}
  # No Apple Developer ID exists for this project. '-' means ad-hoc, which is
  # NOT the same as null: null skips signing entirely, leaving the Electron
  # binary's own linker signature in place with the wrong identifier and
  # unbound resources, which Gatekeeper rejects outright on a quarantined
  # download. Replace with the "Developer ID Application: ..." name the day a
  # certificate exists (see RELEASING.md).
  identity: '-'
  # Generated by scripts/make-icons.mjs and committed. Regenerate only when the
  # mark changes; a contributor who never runs the script can still build.
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # A menu bar utility has no Dock presence and no main window.
  extendInfo:
    LSUIElement: true
    # NSAppleEventsUsageDescription was removed with Spotify (feature 003): the
    # app no longer sends Apple Events, so macOS never prompts for automation
    # access (research.md R-211).
    NSDesktopFolderUsageDescription: >-
      Mini Menu Bar reads your Desktop to show recent screenshots. It never
      modifies, moves, or deletes any file.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  title: ${productName} ${version}
  window:
    width: 540
    height: 380
  iconSize: 110
  # The drag-to-install layout every macOS user already knows.
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

# owner/repo are deliberately absent: electron-builder infers them from
# package.json's `repository` field, so the slug lives in exactly one place.
# Releases are drafts so they can be reviewed before latest.json goes live -
# `releases/latest/download/` only resolves once a release is published.
publish:
  provider: github
  releaseType: draft
